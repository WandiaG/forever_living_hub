<div
  class="relative flex h-auto min-h-screen min-w-9 max-w-md mx-auto flex-col bg-[#fafcf8] justify-between group/design-root overflow-x-hidden"
  style='font-family: Inter, "Noto Sans", sans-serif;'
>
  <div>
    <!-- Header -->
    <div class="flex items-center bg-[#fafcf8] p-4 pb-3 justify-between sticky top-0 z-10 shadow-sm">
      <h2 class="text-[#141b0e] text-xl font-bold leading-tight tracking-[-0.015em] flex-1 text-center pl-12">
        ForeverLiving Hub
      </h2>
      <div class="flex w-12 items-center justify-end">
        <button
          (click)="goToCart()"
          class="flex cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-transparent text-[#141b0e] relative hover:bg-[#edf3e7] transition-colors p-2"
        >
          <div class="text-[#141b0e]" data-icon="ShoppingCart" data-size="24px" data-weight="regular">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
              <path
                d="M222.14,58.87A8,8,0,0,0,216,56H54.68L49.79,29.14A16,16,0,0,0,34.05,16H16a8,8,0,0,0,0,16h18L59.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,152,204a28,28,0,1,0,28-28H83.17a8,8,0,0,1-7.87-6.57L72.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,222.14,58.87ZM96,204a12,12,0,1,1-12-12A12,12,0,0,1,96,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,192,204Zm4-74.57A8,8,0,0,1,188.1,136H69.22L57.59,72H206.41Z"
              ></path>
            </svg>
          </div>
          <span 
            *ngIf="cartItemCount() > 0" 
            class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold"
          >
            {{ cartItemCount() }}
          </span>
        </button>
      </div>
    </div>

    <!-- Filters and Sort -->
    <div class="flex gap-3 px-4 pb-4 overflow-x-auto">
      <div class="relative flex-shrink-0">
        <select 
          [(ngModel)]="selectedPriceRange" 
          (change)="filterByPrice(selectedPriceRange)"
          class="flex h-10 items-center justify-center gap-x-2 rounded-lg bg-[#edf3e7] pl-4 pr-10 text-[#141b0e] text-sm font-medium leading-normal border-none outline-none appearance-none cursor-pointer min-w-[120px] hover:bg-[#dde7d7] transition-colors"
        >
          <option value="">All Prices</option>
          <option value="under-25">Under Ksh 25</option>
          <option value="25-50">Ksh 25-50</option>
          <option value="50-100">Ksh 50-100</option>
          <option value="over-100">Over Ksh 100</option>
        </select>
        <div class="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none text-[#141b0e]">
          <svg xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path>
          </svg>
        </div>
      </div>
      
      <div class="relative flex-shrink-0">
        <select 
          [(ngModel)]="selectedSort" 
          (change)="sortProducts(selectedSort)"
          class="flex h-10 items-center justify-center gap-x-2 rounded-lg bg-[#edf3e7] pl-4 pr-10 text-[#141b0e] text-sm font-medium leading-normal border-none outline-none appearance-none cursor-pointer min-w-[120px] hover:bg-[#dde7d7] transition-colors"
        >
          <option value="">Sort By</option>
          <option value="name-a-z">Name A-Z</option>
          <option value="name-z-a">Name Z-A</option>
          <option value="price-low-high">Price Low-High</option>
          <option value="price-high-low">Price High-Low</option>
        </select>
        <div class="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none text-[#141b0e]">
          <svg xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path>
          </svg>
        </div>
      </div>
      
      <button 
        *ngIf="selectedPriceRange || selectedSort"
        (click)="clearFilters()"
        class="flex h-10 flex-shrink-0 items-center justify-center px-4 rounded-lg bg-red-100 text-red-600 text-sm font-medium hover:bg-red-200 transition-colors"
      >
        Clear
      </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading()" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-[#73974e]"></div>
      <span class="ml-3 text-[#73974e] font-medium">Loading products...</span>
    </div>

    <!-- Error State -->
    <div *ngIf="error() && !isLoading()" class="flex flex-col items-center justify-center py-20 px-6">
      <div class="text-red-500 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="48px" height="48px" fill="currentColor" viewBox="0 0 256 256">
          <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z"/>
        </svg>
      </div>
      <p class="text-red-500 text-center mb-6 font-medium">{{ error() }}</p>
      <button 
        (click)="getProducts()"
        class="bg-[#80ec13] text-[#141b0e] px-8 py-3 rounded-lg font-semibold hover:bg-[#70dc03] transition-colors shadow-sm"
      >
        Retry
      </button>
    </div>

    <!-- Products Grid -->
    <div *ngIf="!isLoading() && !error()" class="px-4 pb-6">
      <!-- No Products Found -->
      <div *ngIf="filteredItems().length === 0" class="flex flex-col items-center justify-center py-20 px-6">
        <div class="text-[#73974e] mb-6">
          <svg xmlns="http://www.w3.org/2000/svg" width="64px" height="64px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>
          </svg>
        </div>
        <h3 class="text-[#141b0e] text-xl font-bold mb-3">No products found</h3>
        <p class="text-[#73974e] text-center mb-6 max-w-sm">Try adjusting your filters or search criteria to find what you're looking for</p>
        <button 
          (click)="clearFilters()"
          class="bg-[#80ec13] text-[#141b0e] px-8 py-3 rounded-lg font-semibold hover:bg-[#70dc03] transition-colors shadow-sm"
        >
          Show All Products
        </button>
      </div>

      <!-- Product Grid -->
      <div class="grid grid-cols-2 gap-4">
        <div 
          *ngFor="let item of filteredItems(); trackBy: trackByProductId" 
          class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition-all duration-300 hover:transform hover:scale-[1.02] cursor-pointer"
        >
          <!-- Product Image -->
          <div
            (click)="viewProductDetails(item)" 
            class="w-full bg-center bg-no-repeat aspect-square bg-cover relative overflow-hidden"
            [style.background-image]="'url(' + item.imageUrl + ')'"
            (error)="onImageError($event)"
          >
            <!-- Overlay for better text readability if needed -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/10 to-transparent opacity-0 hover:opacity-100 transition-opacity duration-200"></div>
          </div>
          
          <!-- Product Info -->
          <div class="p-4">
            <h3 
              class="text-[#141b0e] text-sm font-semibold leading-tight mb-2 cursor-pointer hover:text-[#73974e] transition-colors line-clamp-2 min-h-[2.5rem]"
              (click)="viewProductDetails(item)"
            >
              {{ item.name }}
            </h3>
            
            <div class="flex items-center justify-between mb-3">
              <p class="text-[#73974e] text-lg font-bold">
                {{ formatPrice(item.price) }}
              </p>
            </div>
            
            <button
              (click)="addToCart(item, $event)"
              class="w-full bg-[#80ec13] text-[#141b0e] py-2.5 px-4 rounded-lg text-sm font-semibold hover:bg-[#70dc03] transition-all duration-200 transform hover:scale-[0.98] active:scale-95 shadow-sm"
            >
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Spacer -->
  <div class="h-5 bg-[#fafcf8]"></div>

  <!-- Bottom Navigation -->
  <div class="sticky bottom-0 bg-[#fafcf8] border-t border-[#edf3e7] shadow-lg">
    <div class="flex gap-2 w-full min-w-9 max-w-md mx-auto px-4 pb-4 pt-3">
      <a 
        (click)="goToHome()" 
        class="flex flex-1 flex-col items-center justify-center gap-2 rounded-xl py-2 text-[#141b0e] cursor-pointer hover:text-[#73974e] hover:bg-[#edf3e7] transition-all duration-200"
      >
        <div class="text-current flex h-6 items-center justify-center" data-icon="House" data-size="24px" data-weight="fill">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path
              d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.53,0,1.14,1.14,0,0,0,.11.11l80,75.48A16,16,0,0,1,224,115.55Z"
            ></path>
          </svg>
        </div>
        <p class="text-current text-xs font-medium leading-normal tracking-[0.015em]">Home</p>
      </a>
      
      <a class="flex flex-1 flex-col items-center justify-center gap-2 rounded-xl py-2 text-[#73974e] bg-[#edf3e7]">
        <div class="text-[#73974e] flex h-6 items-center justify-center" data-icon="MagnifyingGlass" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
          </svg>
        </div>
        <p class="text-[#73974e] text-xs font-medium leading-normal tracking-[0.015em]">Shop</p>
      </a>

      <a 
        (click)="goToAdmin()" 
        class="flex flex-1 flex-col items-center justify-center gap-2 rounded-xl py-2 text-[#73974e] cursor-pointer hover:text-[#141b0e] hover:bg-[#edf3e7] transition-all duration-200"
      >
        <div class="text-current flex h-6 items-center justify-center" data-icon="User" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path
              d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"
            ></path>
          </svg>
        </div>
        <p class="text-current text-xs font-medium leading-normal tracking-[0.015em]">Admin</p>
      </a>
    </div>
  </div>
</div>
