<div
  class="relative flex h-auto min-h-screen min-w-sm max-w-md mx-auto flex-col bg-white justify-between group/design-root overflow-x-hidden"
  style='font-family: Inter, "Noto Sans", sans-serif;'
>
  <div>
    <div class="flex items-center bg-white p-4 pb-2 justify-between">
      <div class="text-[#141811] flex size-12 shrink-0 items-center" data-icon="ArrowLeft" data-size="24px" data-weight="regular">
        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
          <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
      </div>
      <h2 class="text-[#141811] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Contact Us</h2>
    </div>

    <!-- Success Message -->
    <div *ngIf="isSuccess" class="mx-4 mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
      Message sent successfully! We'll get back to you soon.
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="mx-4 mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
      {{ errorMessage }}
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <input
          [(ngModel)]="newMessage.sender"
          placeholder="Name *"
          class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none h-14 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
          required
        />
      </label>
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <input
          [(ngModel)]="newMessage.phone"
          type="tel"
          placeholder="Phone"
          class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none h-14 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
        />
      </label>
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <input
          [(ngModel)]="newMessage.email"
          type="email"
          placeholder="Email"
          class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none h-14 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
        />
      </label>
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <input
          [(ngModel)]="newMessage.subject"
          placeholder="Subject *"
          class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none h-14 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
          required
        />
      </label>
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <textarea
          [(ngModel)]="newMessage.message"
          placeholder="Message *"
          class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none min-h-36 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
          required
        ></textarea>
      </label>
    </div>

    <div class="flex px-4 py-3">
      <button
        (click)="onSend()"
        [disabled]="isLoading || !newMessage.sender || !newMessage.subject || !newMessage.message"
        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 flex-1 bg-[#80ec13] text-[#141811] text-sm font-bold leading-normal tracking-[0.015em] disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span class="truncate">{{ isLoading ? 'Sending...' : 'Send Message' }}</span>
      </button>
    </div>
  </div>

  <div>
    <div class="flex gap-2 border-t border-[#f2f4f0] bg-white px-4 pb-3 pt-2">
      <a routerLink="/landing_page" class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#758961]">
        <div class="text-[#758961] flex h-8 items-center justify-center" data-icon="House" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path
              d="M218.83,103.77l-80-75.48a1.14,1.14,0,0,1-.11-.11,16,16,0,0,0-21.53,0l-.11.11L37.17,103.77A16,16,0,0,0,32,115.55V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V160h32v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V115.55A16,16,0,0,0,218.83,103.77ZM208,208H160V160a16,16,0,0,0-16-16H112a16,16,0,0,0-16,16v48H48V115.55l.11-.1L128,40l79.9,75.43.11.10Z"
            ></path>
          </svg>
        </div>
        <p class="text-[#758961] text-xs font-medium leading-normal tracking-[0.015em]">Home</p>
      </a>
      <a routerLink="/products" class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#758961]">
        <div class="text-[#758961] flex h-8 items-center justify-center" data-icon="MagnifyingGlass" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
          </svg>
        </div>
        <p class="text-[#758961] text-xs font-medium leading-normal tracking-[0.015em]">Shop</p>
      </a>
      <a routerLink="/cart" class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#758961]">
        <div class="text-[#758961] flex h-8 items-center justify-center" data-icon="ShoppingCart" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path
              d="M222.14,58.87A8,8,0,0,0,216,56H54.68L49.79,29.14A16,16,0,0,0,34.05,16H16a8,8,0,0,0,0,16h18L59.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,152,204a28,28,0,1,0,28-28H83.17a8,8,0,0,1-7.87-6.57L72.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,222.14,58.87ZM96,204a12,12,0,1,1-12-12A12,12,0,0,1,96,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,192,204Zm4-74.57A8,8,0,0,1,188.1,136H69.22L57.59,72H206.41Z"
            ></path>
          </svg>
        </div>
        <p class="text-[#758961] text-xs font-medium leading-normal tracking-[0.015em]">Cart</p>
      </a>
    </div>
    <div class="h-5 bg-white"></div>
  </div>
</div>
