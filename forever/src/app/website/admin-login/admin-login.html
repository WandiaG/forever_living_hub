<div
  class="relative flex h-auto min-h-screen min-w-9 max-w-md mx-auto flex-col bg-[#f5f5f5] justify-between group/design-root overflow-x-hidden"
  style='font-family: Inter, "Noto Sans", sans-serif;'
>
  <div>
    <div class="flex items-center bg-[#ffffff] p-4 pb-2 justify-between shadow-sm">
      <div routerLink="/landing_page" class="text-[#141b0d] flex size-12 shrink-0 items-center cursor-pointer" data-icon="ArrowLeft" data-size="24px" data-weight="regular">
        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
          <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
      </div>
      <h2 class="text-[#141b0d] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Login</h2>
    </div>

    <div class="bg-white rounded-xl shadow-md mx-4 mt-6 p-6">
      <h2 class="text-[#141b0d] tracking-light text-[28px] font-bold leading-tight text-center pb-2">Welcome Admin</h2>
      <p class="text-[#739a4c] text-base font-normal leading-normal px-4 text-center pb-6">ForeverLiving Hub</p>
      
      <p *ngIf="errorMessage()" class="text-red-500 text-sm text-center mb-4 font-semibold">
        {{ errorMessage() }}
      </p>

      <form (ngSubmit)="handleLogin()">
        <div class="flex flex-wrap items-end gap-4 px-2 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <input
              placeholder="Email" 
              type="email"
              required
              [(ngModel)]="email"
              name="email"
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141b0d] focus:outline-0 focus:ring-0 border-none bg-[#f0f0f0] focus:border-none h-14 placeholder:text-[#a0a0a0] p-4 text-base font-normal leading-normal"
            />
          </label>
        </div>

        <div class="flex flex-wrap items-end gap-4 px-2 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <input
              placeholder="Password"
              type="password"
              required
              [(ngModel)]="password"
              name="password"
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141b0d] focus:outline-0 focus:ring-0 border-none bg-[#f0f0f0] focus:border-none h-14 placeholder:text-[#a0a0a0] p-4 text-base font-normal leading-normal"
            />
          </label>
        </div>

        <p class="text-[#739a4c] text-sm font-normal leading-normal pt-1 px-2 underline text-right">Forgot Password?</p>
        
        <div class="flex px-4 py-3 mt-8">
          <button
            type="submit"
            [disabled]="isLoading()"
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-[#80ec13] text-[#141b0d] text-base font-bold leading-normal tracking-[0.015em] shadow-lg disabled:opacity-50"
          >
            <span *ngIf="!isLoading()" class="truncate">Login</span>
            <span *ngIf="isLoading()" class="truncate">Logging in...</span>
          </button>
        </div>
      </form>git 
    </div>
  </div>

  <div>
    <p class="text-[#739a4c] text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center underline">Don't have an account? Sign Up</p>
    <div class="h-5 bg-[#f5f5f5]"></div>
  </div>
</
