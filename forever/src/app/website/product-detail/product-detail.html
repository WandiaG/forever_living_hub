<div
  class="relative flex h-auto min-h-screen min-w-9 max-w-md mx-auto flex-col bg-[#fafcf8] justify-between group/design-root overflow-x-hidden"
  style='font-family: Inter, "Noto Sans", sans-serif;'
>
  <div>
    <div class="flex items-center bg-[#fafcf8] p-4 pb-2 justify-between">
      <div 
        (click)="goBack()" 
        class="text-[#141b0e] flex size-12 shrink-0 items-center cursor-pointer hover:bg-gray-100 rounded-full p-2 transition-colors" 
        data-icon="ArrowLeft" 
        data-size="24px" 

        
        data-weight="regular"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
          <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
      </div>
      <h2 class="text-[#141b0e] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
        ForeverLiving Hub
      </h2>
    </div>

    <div *ngIf="isLoading()" class="flex flex-col items-center justify-center py-16 px-4">
      <p class="text-[#73974e] text-lg">Loading product details...</p>
    </div>

    <div *ngIf="error() && !isLoading()" class="flex flex-col items-center justify-center py-16 px-4">
      <div class="text-red-500 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="48px" height="48px" fill="currentColor" viewBox="0 0 256 256">
          <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z"/>
        </svg>
      </div>
      <p class="text-red-500 text-center mb-4">{{ error() }}</p>
      <button 
        (click)="retryLoading()"
        class="bg-[#80ec13] text-[#141b0e] px-6 py-2 rounded-lg font-medium hover:bg-[#70dc03] transition-colors"
      >
        Retry
      </button>
    </div>

    <ng-container *ngIf="!isLoading() && !error() && viewProduct() as details">
      <div class="@[480px]:px-4 @[480px]:py-3">
        <div
          class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden bg-[#fafcf8] @[480px]:rounded-lg min-h-80"
          [style.background-image]="'url(' + details.imageUrl + ')'"
          (error)="onImageError($event)"
        ></div>
      </div>
      
      <h1 class="text-[#141b0e] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 text-left pb-3 pt-5">
        {{ details.name }}
      </h1>
      <p class="text-[#73974e] text-lg font-semibold leading-normal pb-3 pt-1 px-4">
        {{ formatPrice(details.price) }}
      </p>
      
      <div class="flex px-4 py-3">
        <button
          class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-[#80e619] text-[#141b0e] text-base font-bold leading-normal tracking-[0.015em] hover:bg-[#70dc03] transition-colors"
        >
          <span class="truncate">Add to Cart</span>
        </button>
      </div>
      
      <div *ngIf="details.description" class="px-4 py-2">
        <h2 class="text-[#141b0e] text-[22px] font-bold leading-tight tracking-[-0.015em] pb-3 pt-3">
          Description
        </h2>
        <p class="text-[#141b0e] text-base font-normal leading-normal pb-3">
          {{ details.description }}
        </p>
      </div>
      
      <div *ngIf="details.benefit" class="px-4 py-2">
        <h2 class="text-[#141b0e] text-[22px] font-bold leading-tight tracking-[-0.015em] pb-3 pt-3">
          Benefits
        </h2>
        <p class="text-[#141b0e] text-base font-normal leading-normal pb-3">
          {{ details.benefit }}
        </p>
      </div>
    </ng-container>
  </div>

  <div>
    <div class="flex gap-2 border-t border-[#edf3e7] bg-[#fafcf8] px-4 pb-3 pt-2">
      <a (click)="goToHome()" class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#73974e] cursor-pointer hover:text-[#141b0e] transition-colors">
        <div class="text-current flex h-8 items-center justify-center" data-icon="House" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M218.83,103.77l-80-75.48a1.14,1.14,0,0,1-.11-.11,16,16,0,0,0-21.53,0l-.11.11L37.17,103.77A16,16,0,0,0,32,115.55V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V160h32v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V115.55A16,16,0,0,0,218.83,103.77ZM208,208H160V160a16,16,0,0,0-16-16H112a16,16,0,0,0-16,16v48H48V115.55l.11-.1L128,40l79.9,75.43.11.10Z"></path>
          </svg>
        </div>
        <p class="text-current text-xs font-medium leading-normal tracking-[0.015em]">Home</p>
      </a>
      
      <a routerLink="/products" class="just flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-[#141b0e]">
        <div class="text-[#141b0e] flex h-8 items-center justify-center" data-icon="ShoppingBag" data-size="24px" data-weight="fill">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm-88,96A48.05,48.05,0,0,1,80,88a8,8,0,0,1,16,0,32,32,0,0,0,64,0,8,8,0,0,1,16,0A48.05,48.05,0,0,1,128,136Z"></path>
          </svg>
        </div>
        <p class="text-[#141b0e] text-xs font-medium leading-normal tracking-[0.015em]">Shop</p>
      </a>
      
      <a (click)="goToCart()" class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#73974e] cursor-pointer hover:text-[#141b0e] transition-colors">
        <div class="text-current flex h-8 items-center justify-center" data-icon="ShoppingCart" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M222.14,58.87A8,8,0,0,0,216,56H54.68L49.79,29.14A16,16,0,0,0,34.05,16H16a8,8,0,0,0,0,16h18L59.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,152,204a28,28,0,1,0,28-28H83.17a8,8,0,0,1-7.87-6.57L72.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,222.14,58.87ZM96,204a12,12,0,1,1-12-12A12,12,0,0,1,96,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,192,204Zm4-74.57A8,8,0,0,1,188.1,136H69.22L57.59,72H206.41Z"></path>
          </svg>
        </div>
        <p class="text-current text-xs font-medium leading-normal tracking-[0.015em]">Cart</p>
      </a>
      
      <a class="just flex flex-1 flex-col items-center justify-end gap-1 text-[#73974e] cursor-pointer hover:text-[#141b0e] transition-colors" routerLink="/admins/products">
        <div class="text-current flex h-8 items-center justify-center" data-icon="User" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"></path>
          </svg>
        </div>
        <p class="text-current text-xs font-medium leading-normal tracking-[0.015em]">Admin</p>
      </a>
    </div>
    <div class="h-5 bg-[#fafcf8]"></div>
  </div> 
</div>
