<div
  class="relative flex h-auto min-h-screen min-w-9 mx-auto w-full flex-col bg-white justify-between group/design-root overflow-x-hidden"
  style='font-family: Inter, "Noto Sans", sans-serif;'
>
  <ng-container *ngIf="messageDetails() as details">
    <div>
      <div class="flex items-center bg-white p-4 pb-2 justify-between">
        <div (click)="goBack()" class="text-[#141811] flex size-12 shrink-0 items-center cursor-pointer" data-icon="ArrowLeft" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
          </svg>
        </div>
        <h2 class="text-[#141811] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Message Details</h2>
      </div>

      <h3 class="text-[#141811] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Sender</h3>
      <div class="flex items-center gap-4 bg-white px-4 min-h-[72px] py-2">
        <div class="text-[#141811] flex items-center justify-center rounded-lg bg-[#f2f4f0] shrink-0 size-12" data-icon="Phone" data-size="24px" data-weight="regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M222.37,158.46l-47.11-21.11-.13-.06a16,16,0,0,0-15.17,1.4,8.12,8.12,0,0,0-.75.56L134.87,160c-15.42-7.49-31.34-23.29-38.83-38.51l20.78-24.71c.2-.25.39-.5.57-.77a16,16,0,0,0,1.32-15.06l0-.12L97.54,33.64a16,16,0,0,0-16.62-9.52A56.26,56.26,0,0,0,32,80c0,79.4,64.6,144,144,144a56.26,56.26,0,0,0,55.88-48.92A16,16,0,0,0,222.37,158.46ZM176,208A128.14,128.14,0,0,1,48,80,40.2,40.2,0,0,1,82.87,40a.61.61,0,0,0,0,.12l21,47L83.2,111.86a6.13,6.13,0,0,0-.57.77,16,16,0,0,0-1,15.7c9.06,18.53,27.73,37.06,46.46,46.11a16,16,0,0,0,15.75-1.14,8.44,8.44,0,0,0,.74-.56L168.89,152l47,21.05h0s.08,0,.11,0A40.21,40.21,0,0,1,176,208Z"></path>
          </svg>
        </div>
        <div class="flex flex-col justify-center">
          <p class="text-[#141811] text-base font-medium leading-normal line-clamp-1">{{ details.sender }}</p>
          <p *ngIf="details.phone" class="text-[#758961] text-sm font-normal leading-normal line-clamp-2">{{ details.phone }}</p>
          <p *ngIf="details.email" class="text-[#758961] text-sm font-normal leading-normal line-clamp-2">{{ details.email }}</p>
          <p class="text-[#141811] text-sm font-medium leading-normal mt-2">
            Status: 
            <span [ngClass]="{'text-green-600': details.is_replied == 1, 'text-yellow-600': details.is_replied == 0}">
              {{ details.is_replied == 1 ? "Replied" : "Pending" }}
            </span>
          </p>
        </div>
      </div>

      <h3 class="text-[#141811] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Subject: {{ details.subject }}</h3>
      <p class="text-[#141811] text-base font-normal leading-normal pb-3 pt-1 px-4">
        {{ details.message }}
      </p>
      <p class="text-[#758961] text-sm font-normal leading-normal pb-3 pt-1 px-4">Received: {{ details.created_at | date: 'medium' }}</p>

      <div class="flex justify-stretch">
        <div class="flex flex-1 gap-3 flex-wrap px-4 py-3 justify-between">
          <button
            (click)="updateReplyStatus(true)"
            [disabled]="details.is_replied == 1"
            [ngClass]="{'opacity-50 cursor-not-allowed': details.is_replied == 1}"
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#80ec13] text-[#141811] text-sm font-bold leading-normal tracking-[0.015em]"
          >
            <span class="truncate">Mark as Replied</span>
          </button>
          <button
            (click)="updateReplyStatus(false)"
            [disabled]="details.is_replied == 0"
            [ngClass]="{'opacity-50 cursor-not-allowed': details.is_replied == 0}"
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#f2f4f0] text-[#141811] text-sm font-bold leading-normal tracking-[0.015em]"
          >
            <span class="truncate">Mark as Pending</span>
          </button>
        </div>
      </div>

      <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
          <textarea
            [ngModel]="replyMessageSignal()"
            (ngModelChange)="replyMessageSignal.set($event)"
            placeholder="Type your reply here..."
            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border border-[#e0e6db] bg-white focus:border-[#e0e6db] min-h-36 placeholder:text-[#758961] p-[15px] text-base font-normal leading-normal"
          ></textarea>
        </label>
      </div>
    </div>

    <div>
      <div class="flex px-4 py-3">
        <button
          (click)="sendReply()"
          [disabled]="!replyMessageSignal()"
          [ngClass]="{'opacity-50 cursor-not-allowed': !replyMessageSignal()}"
          class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 flex-1 bg-[#80ec13] text-[#141811] text-sm font-bold leading-normal tracking-[0.015em]"
        >
          <span class="truncate">Send Reply</span>
        </button>
      </div>
      <div class="h-5 bg-white"></div>
    </div>
  </ng-container>

  <div *ngIf="!messageDetails()" class="text-center p-8 text-gray-500">
    Loading message details...
  </div>
</div>
