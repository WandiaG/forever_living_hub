<div
  class="relative flex h-auto min-h-screen min-w-9 mx-auto flex-col bg-white justify-between group/design-root overflow-x-hidden"
  style='font-family: Inter, "Noto Sans", sans-serif;'
>
  <div>
    <div class="flex items-center bg-white p-4 pb-2 justify-between">
      <div 
        (click)="onBackClick()" 
        class="text-[#141811] flex size-12 shrink-0 items-center cursor-pointer hover:text-[#758961] transition-colors" 
        data-icon="ArrowLeft" 
        data-size="24px" 
        data-weight="regular"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
          <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
      </div>
      <h2 class="text-[#141811] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
        {{ pageTitle }}
      </h2>
    </div>
    
    <div *ngIf="isLoading" class="px-4 py-2">
      <div class="text-center text-[#758961]">Loading product data...</div>
    </div>
    
    <form (ngSubmit)="onSave()" #productForm="ngForm" class="flex flex-col gap-4">
      <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
          <p class="text-[#141811] text-base font-medium leading-normal pb-2">Product Name *</p>
          <input
            [(ngModel)]="newProduct.name"
            name="name"
            placeholder="Enter product name"
            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none h-14 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
            [class.ring-2]="newProduct.name.trim() === '' && productForm.submitted"
            [class.ring-red-300]="newProduct.name.trim() === '' && productForm.submitted"
            required
          />
        </label>
      </div>
      
      <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
          <p class="text-[#141811] text-base font-medium leading-normal pb-2">Description</p>
          <textarea
            [(ngModel)]="newProduct.description"
            name="description"
            placeholder="Enter product description"
            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none min-h-36 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
          ></textarea>
        </label>
      </div>
      
      <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
          <p class="text-[#141811] text-base font-medium leading-normal pb-2">Benefits</p>
          <textarea
            [(ngModel)]="newProduct.benefit"
            name="benefit"
            placeholder="Enter product benefits"
            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none min-h-36 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
          ></textarea>
        </label>
      </div>
      
      <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
          <p class="text-[#141811] text-base font-medium leading-normal pb-2">Price *</p>
          <input
            [(ngModel)]="newProduct.price"
            name="price"
            type="number"
            step="0.01"
            min="0"
            placeholder="Enter product price"
            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none h-14 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
            [class.ring-2]="newProduct.price <= 0 && productForm.submitted"
            [class.ring-red-300]="newProduct.price <= 0 && productForm.submitted"
            required
          />
        </label>
      </div>
      
      <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
          <p class="text-[#141811] text-base font-medium leading-normal pb-2">Image URL *</p>
          <input
            [(ngModel)]="newProduct.imageUrl"
            name="imageUrl"
            placeholder="Enter image URL"
            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#141811] focus:outline-0 focus:ring-0 border-none bg-[#f2f4f0] focus:border-none h-14 placeholder:text-[#758961] p-4 text-base font-normal leading-normal"
            [class.ring-2]="newProduct.imageUrl.trim() === '' && productForm.submitted"
            [class.ring-red-300]="newProduct.imageUrl.trim() === '' && productForm.submitted"
            required
          />
        </label>
      </div>
      
      <div *ngIf="newProduct.imageUrl" class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <div class="flex flex-col min-w-40 flex-1">
          <p class="text-[#141811] text-base font-medium leading-normal pb-2">Image Preview</p>
          <div class="w-32 h-32 rounded-lg overflow-hidden border border-[#e0e6db]">
            <img 
              [src]="newProduct.imageUrl" 
              alt="Product preview"
              class="w-full h-full object-cover"
              (error)="onImageError($event)"
            />
          </div>
        </div>
      </div>
      
      <div class="flex flex-col p-4">
        <div class="flex flex-col items-center gap-6 rounded-lg border-2 border-dashed border-[#e0e6db] px-6 py-14">
          <div class="flex max-w-[480px] flex-col items-center gap-2">
            <p class="text-[#141811] text-lg font-bold leading-tight tracking-[-0.015em] max-w-[480px] text-center">
              {{ isEditMode ? 'Change Product Image' : 'Upload Product Image' }}
            </p>
            <p class="text-[#141811] text-sm font-normal leading-normal max-w-[480px] text-center">
              Tap to {{ isEditMode ? 'change' : 'upload' }} an image of the product
            </p>
          </div>
          <label for="file-upload" class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#f2f4f0] text-[#141811] text-sm font-bold leading-normal tracking-[0.015em] hover:bg-[#e8ebe4] transition-colors">
            <span class="truncate">{{uploadedFile?.name || (isEditMode ? 'Change Image' : 'Upload Image')}}</span>
          </label>
          <input
            id="file-upload"
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            class="hidden"
          />
        </div>
      </div>

      <div>
        <div class="flex gap-3 px-4 py-3">
          <button
            type="button"
            (click)="onBackClick()"
            [disabled]="isLoading"
            class="flex min-w-[84px] max-w-[240px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-gray-200 text-[#141811] text-base font-medium leading-normal tracking-[0.015em] disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-300 transition-colors"
          >
            <span class="truncate">Cancel</span>
          </button>
          
          <button
            type="submit"
            [disabled]="isLoading || productForm.invalid"
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-[#c28421] text-[#141811] text-base font-bold leading-normal tracking-[0.015em] disabled:opacity-50 disabled:cursor-not-allowed hover:bg-[#a67019] transition-colors"
          >
            <span class="truncate">{{ getCurrentButtonText() }}</span>
          </button>
        </div>
        
        <div class="h-5 bg-white"></div>
      </div>
    </form>
  </div>
</div>
